<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Product Spec | AURA Studio</title>
  <meta name="description" content="Detailed view of selected product with visual similarity details.">
  <link rel="stylesheet" href="style.css">
</head>
<body data-page="product">

  <!-- Navbar -->
  <nav class="navbar">
    <a href="index.html" class="logo-container">
      <div class="logo-icon">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 2v20M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"></path>
        </svg>
      </div>
      <span class="logo-text">AURA STUDIO</span>
    </a>
    <ul class="nav-links">
      <li><a href="index.html">Discover</a></li>
      <li><a href="results.html">Catalog</a></li>
    </ul>
  </nav>

  <!-- Main Container -->
  <main class="main-container">

    <div style="margin-bottom: 1.75rem;">
      <a href="javascript:history.back()" style="color: var(--text-muted); text-decoration: none; font-weight: 600; font-size: 0.9rem; display: inline-flex; align-items: center; gap: 0.4rem;">
        ← Back to Catalog
      </a>
    </div>

    <!-- Product Detail Card -->
    <article class="product-detail-container">

      <!-- Left Column: Large Product Image -->
      <div class="detail-img-wrapper">
        <img id="productImage" class="detail-img" src="" alt="Product Detail Image" onerror="this.src='https://via.placeholder.com/600?text=Product+Image'">
      </div>

      <!-- Right Column: Product Metadata & Actions -->
      <div class="detail-info">
        <div id="detailSimilarityBadge" class="similarity-badge" style="display: none; position: relative; top: 0; right: 0; margin-bottom: 0.5rem; width: fit-content;">
          <!-- Rendered dynamically -->
        </div>

        <span id="productCategory" class="product-category" style="font-size: 0.8rem;">Category</span>
        
        <h1 id="productTitle" class="detail-title">Loading Product...</h1>
        
        <div id="productPrice" class="detail-price">₹0</div>
        
        <hr style="border: none; height: 1px; background: var(--border-subtle); margin: 0.5rem 0;">

        <div>
          <h3 style="font-family: 'Outfit', sans-serif; font-size: 1.05rem; font-weight: 700; color: var(--text-main); margin-bottom: 0.5rem;">Product Description</h3>
          <p id="productDescription" class="detail-description">Loading details...</p>
        </div>

        <div style="margin-top: 1.5rem;">
          <button type="button" class="btn-similar-search" id="findSimilarBtn">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="11" cy="11" r="8"></circle>
              <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
              <path d="M11 8v6M8 11h6"></path>
            </svg>
            <span>Find Visually Similar Products</span>
          </button>
        </div>
      </div>

    </article>

  </main>

  <!-- Loading Overlay -->
  <div class="loading-overlay" id="loadingOverlay">
    <div class="ai-spinner"></div>
    <div class="loading-text" id="loadingText">Loading details...</div>
  </div>

  <!-- Footer -->
  <footer class="footer">
    <p>AURA Commerce Engine &copy; 2026 | Visual & Semantic Product Intelligence</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
